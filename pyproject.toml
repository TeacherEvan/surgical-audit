[project]
name = "surgical-audit"
version = "2.4.0"
description = "Zero-mutation 10-lens code, runtime-geometry, and document audit skill."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Keep canonical conform.py byte-identical across the skill family.
"scripts/conform.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
