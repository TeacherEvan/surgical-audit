---
name: Skill CI

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lint and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest ruff mypy pyyaml jsonschema check-jsonschema yamllint
          sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Conformance gate
        run: python3 -B scripts/conform.py
      - name: Lint and typecheck Python
        run: |
          ruff check --no-cache scripts/ tests/
          ruff check --no-cache --select E,W,F,I,B,UP,SIM,C901,EXE \
            scripts/ tests/
          ruff format --check --no-cache scripts/ tests/
          mypy --strict --cache-dir /tmp/mypy_cache_sa scripts/ tests/
      - name: Run unit tests
        run: pytest -o cache_dir=/tmp/pytest_cache_sa -v tests/
      - name: Lint shell scripts and CI workflow
        run: |
          shellcheck -x install_surgical_audit.sh scripts/sync-skill.sh
          yamllint --strict .github/workflows/skill-ci.yml
      - name: Check JS probe syntax
        run: node --check scripts/canvas_geometry_probe.mjs
      - name: Validate Draft 2020-12 JSON Schemas
        run: check-jsonschema --check-metaschema schemas/*.schema.json
